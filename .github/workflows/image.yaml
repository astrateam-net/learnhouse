---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Called by build.yaml. The image is built from the assembled tree, so every build job applies the
# series and overlay first. Without `release` it builds and runs tests.yaml; with it, it pushes
# ghcr.io/<owner>/learnhouse and attests it.
name: Image

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        description: Push to ghcr.io and attest
        required: true
      patch:
        type: string
        description: Our release slot, the N in 4.5.N
        required: false
        default: "0"
    outputs:
      version:
        description: The version built, 4.5.N
        value: ${{ jobs.prepare.outputs.version }}
      digest:
        description: The published manifest digest; empty unless release
        value: ${{ jobs.merge.outputs.digest }}

# No permissions here or on the jobs: they inherit the caller's grant, read-only for a pull
# request and write for a release. A job asking for more than the caller grants fails the run at
# startup, even when that job would be skipped.

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.options.outputs.platforms }}
      release: ${{ steps.options.outputs.release }}
      version: ${{ steps.options.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Version from the submodule plus our slot. A release never overwrites a published tag: bump
      # `patch`.
      - name: Application Options
        id: options
        env:
          RELEASE: ${{ inputs.release }}
          PATCH: ${{ inputs.patch }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/learnhouse
        run: |
          source .mise/lib.sh
          VERSION="$(our_version "$PATCH")"
          if [ "$RELEASE" = true ] && docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} is already published; dispatch again with the next patch"
            exit 1
          fi
          PLATFORMS=$(docker buildx bake image-all --print --progress=quiet | jq --raw-output --compact-output '.target."image-all".platforms')
          {
            echo "version=${VERSION}"
            echo "platforms=${PLATFORMS}"
            echo "release=${RELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Application Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          flavor: latest=false
          images: |
            ghcr.io/${{ github.repository_owner }}/learnhouse
          tags: |
            type=semver,pattern={{version}},value=${{ steps.options.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.options.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.options.outputs.version }}
            type=raw,value=rolling

      - name: Upload Bake Metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learnhouse-bake-metadata
          path: ${{ steps.meta.outputs.bake-file }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build (${{ matrix.platform }})
    needs: ["prepare"]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.platforms) }}
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # quilt is in neither the mise registry nor the pkgx pantry; apt is the only source for it.
      - name: Install quilt
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Assemble Build Context
        run: mise run build:context

      # Cache per arch in learnhouse's own package; push by digest only on release.
      - name: Get Bake Options
        id: target
        env:
          PLATFORM: ${{ matrix.platform }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ARCH="${PLATFORM##*/}"
          CACHE="ghcr.io/${OWNER}/learnhouse-build-cache:${ARCH}"
          {
            echo "arch=${ARCH}"
            echo "build-id=$(git -C lib/learnhouse rev-parse HEAD)"
            echo "cache-from=type=registry,ref=${CACHE}"
            if [ "$RELEASE" = true ]; then
              echo "cache-to=type=registry,ref=${CACHE},mode=max,compression=zstd,force-compression=true"
              echo "output=type=image,name=ghcr.io/${OWNER}/learnhouse,push-by-digest=true,name-canonical=true,push=true"
            else
              echo "cache-to="
              echo "output=type=docker"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download Bake Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: learnhouse-bake-metadata
          path: ${{ runner.temp }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Local source, not the git context: the patched tree exists only on disk.
      - name: Build Application
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        id: bake
        env:
          BUILD_ID: ${{ steps.target.outputs.build-id }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ runner.temp }}/docker-metadata-action-bake.json
          set: |
            *.cache-from=${{ steps.target.outputs.cache-from }}
            *.cache-to=${{ steps.target.outputs.cache-to }}
            *.labels.org.opencontainers.image.title=learnhouse
            *.labels.org.opencontainers.image.url=https://ghcr.io/${{ github.repository_owner }}/learnhouse
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.vendor=${{ github.repository_owner }}
            *.output=${{ steps.target.outputs.output }}
            *.platform=${{ matrix.platform }}
            *.tags=
          source: .
          targets: image

      # The proof that the image carries the series and overlay, not stock LearnHouse.
      - if: ${{ needs.prepare.outputs.release != 'true' }}
        name: Run Structure Tests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          IMAGE=$(jq --raw-output '.image | ."containerimage.config.digest" // ."containerimage.digest"' <<< "$METADATA")
          mise exec -- container-structure-test test --image "$IMAGE" --config tests.yaml

      - if: ${{ needs.prepare.outputs.release == 'true' }}
        name: Export Digest
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - if: ${{ needs.prepare.outputs.release == 'true' }}
        name: Upload Digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learnhouse-digests-${{ steps.target.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: ${{ needs.prepare.outputs.release == 'true' }}
    name: Merge
    runs-on: ubuntu-latest
    needs: ["prepare", "build"]
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download Bake Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: learnhouse-bake-metadata
          path: ${{ runner.temp }}

      - name: Download Digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: learnhouse-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Manifest List and Push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/learnhouse
        run: |
          # One "-t <tag>" pair per published tag, then every per-arch digest.
          mapfile -t ARGS < <(jq --raw-output --arg image "$IMAGE" \
            '.target."docker-metadata-action".tags[] | select(startswith($image)) | "-t", .' \
            "${RUNNER_TEMP}/docker-metadata-action-bake.json")
          for digest in *; do
            ARGS+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${ARGS[@]}"

      - name: Export Digest
        id: digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/learnhouse
        run: |
          TAG=$(jq --raw-output '.target."docker-metadata-action".args.DOCKER_META_VERSION' "${RUNNER_TEMP}/docker-metadata-action-bake.json")
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{ json . }}' | jq --raw-output '.manifest.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  attest:
    if: ${{ needs.prepare.outputs.release == 'true' }}
    name: Attest
    needs: ["prepare", "merge"]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Upload Dependency Snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          dependency-snapshot: true
          image: ghcr.io/${{ github.repository_owner }}/learnhouse@${{ needs.merge.outputs.digest }}

      - name: Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/learnhouse
          subject-digest: ${{ needs.merge.outputs.digest }}

      - name: Verify Attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT: ghcr.io/${{ github.repository_owner }}/learnhouse@${{ needs.merge.outputs.digest }}
        run: gh attestation verify --repo "$REPOSITORY" "oci://${SUBJECT}"
